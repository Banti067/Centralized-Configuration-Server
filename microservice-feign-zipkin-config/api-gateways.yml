spring:
  application:
    name: api-gateways

  # Redis configuration (enable when using RateLimiter)
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # USER SERVICE ROUTE
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/user/**
          # filters:
          #   - StripPrefix=2

        # ORDER SERVICE ROUTE
        - id: order-services
          uri: lb://ORDER-SERVICES
          predicates:
            - Path=/api/v1/order/**
          # filters:
          #   - StripPrefix=2
          #   - name: RequestRateLimiter
          #     args:
          #       redis-rate-limiter.replenishRate: 5
          #       redis-rate-limiter.burstCapacity: 5
          #       redis-rate-limiter.requestedTokens: 1
          #       key-resolver: "#{@ipKeyResolver}"

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,metrics,refresh
  endpoint:
    gateway:
      enabled: true

