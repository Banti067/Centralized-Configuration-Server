spring:
  application:
    name: order-services

  datasource:
    url: jdbc:mysql://localhost:3306/demo_feign_data
    username: root
    password: Banti@321
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:  health,info,metrics,conditions,env

  # 🔥 THIS SECTION WAS MISSING / INCOMPLETE
  observations:
    web:
      server:
        enabled: true   # ✅ REQUIRED → creates trace for incoming HTTP requests

  tracing:
    enabled: true      # ✅ EXPLICIT (best practice in Boot 4)
    sampling:
      probability: 1.0 # dev only
    propagation:
      type: b3         # matches Zipkin & your manual Feign headers

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
