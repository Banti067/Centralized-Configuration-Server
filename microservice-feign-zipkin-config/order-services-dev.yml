spring:
  application:
    name: order-services

  datasource:
    url: jdbc:mysql://localhost:3306/demo_feign_data   # changed from mysql → localhost
    username: root
    password: Banti@321
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka   # changed from eurekaservice
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0   # dev only (reduce in prod)
    export:
      enabled: true      # ✅ THIS enables tracing in Boot 4

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
